name: Recursive
description: Recursive (Recursive Superintelligence) is an AI research company founded in 2025 and
  backed by Earlybird, building recursive self-improving systems designed to automate knowledge discovery
  and accelerate scientific progress, beginning with AI research itself. Its team of researchers and
  entrepreneurs previously worked at OpenAI, DeepMind, Google Brain, Meta, Salesforce and Uber, and works
  on open-ended algorithms, AI-generating algorithms and self-improving systems. The company is based in
  San Francisco with an additional presence in London. Recursive currently publishes no public API,
  developer documentation, SDK, or other machine-readable developer surface; this profile captures its
  identity as a lead in the API Evangelist network.
